# d455:=true 일 때만 쓰는 브리지 (실물 Pinky에는 없는 가정 센서).
# Gazebo rgbd_camera 는 <topic>d455</topic> 아래에 image / depth_image / points / camera_info 를 낸다.
- ros_topic_name: "d455/points"
  gz_topic_name: "d455/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "d455/depth_image"
  gz_topic_name: "d455/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "d455/camera_info"
  gz_topic_name: "d455/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "d455/image"
  gz_topic_name: "d455/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
