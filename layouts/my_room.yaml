# 연습용 빈 방. 여기에 물체를 추가하고 make_world 로 world를 다시 만들어 보세요.
#
#   ros2 run pinky_sim_examples make_world layouts/my_room.yaml -o worlds/my_room.world
#
# 좌표는 Gazebo 좌표 그대로(origin 0,0). 로봇은 (0, 0)에서 +X를 보고 나온다.

world_name: my_room
origin: [0.0, 0.0]
wall_height: 0.25

objects:
  # 2 m x 2 m 방 (로봇이 가운데)
  - {name: north, type: wall, from: [-1.0,  1.0], to: [ 1.0,  1.0]}
  - {name: south, type: wall, from: [-1.0, -1.0], to: [ 1.0, -1.0]}
  - {name: west,  type: wall, from: [-1.0, -1.0], to: [-1.0,  1.0]}
  - {name: east,  type: wall, from: [ 1.0, -1.0], to: [ 1.0,  1.0]}

  # 대각선 벽: from/to 만 주면 길이와 각도는 자동 계산
  - {name: diagonal, type: wall, from: [0.3, 0.3], to: [0.7, 0.7], thickness: 0.03, color: [0.85, 0.6, 0.2]}

  # 기둥
  - {name: pillar, type: cylinder, radius: 0.05, height: 0.3, at: [-0.5, 0.5]}

  # TODO(실습): 로봇 앞(+X) 0.5 m 지점에 상자를 놓아 보세요.
  # - {name: my_box, type: box, size: [0.1, 0.1, 0.2], at: [0.5, 0.0]}
